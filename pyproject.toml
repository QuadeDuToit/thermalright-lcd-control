[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thermalright-lcd-control"
version = "1.3.0"
description = "Linux Thermal rigth lcd display control"
authors = [{ name = "REJEB BEN REJEB", email = "benrejebrejeb@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "PySide6>=6.5",
    "hid~=1.0.8",
    "psutil>=5.8.0",
    "opencv-python>=4.12.0.88",
    "pyusb>=1.3.1",
    "pillow>=11.3.0",
    "pyyaml>=6.0.2",
    "pyqtgraph>=0.13.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["thermalright_lcd_control*"]
exclude = ["resources*"]

[project.scripts]
thermalright-lcd-control = "thermalright_lcd_control.main_gui:main"
thermalright-lcd-service = "thermalright_lcd_control.service:main"
thermalright-lcd-trigger = "thermalright_lcd_control.trigger_animation:main"
