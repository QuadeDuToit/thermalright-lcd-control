paths:
  themes_dir: "/usr/share/thermalright-lcd-control/resources/themes/presets"
  backgrounds_dir: "/usr/share/thermalright-lcd-control/resources/themes/backgrounds"
  foregrounds_dir: "/usr/share/thermalright-lcd-control/resources/themes/foregrounds"
  service_config: "/usr/share/thermalright-lcd-control/resources/config"
window:
  default_width: 1920
  default_height: 1080
  min_width: 800
  min_height: 600

supported_formats:
  images: [ '.jpg', '.jpeg', '.png', '.bmp', '.tiff', '.webp' ]
  videos: [ '.mp4', '.avi', '.mkv', '.mov', '.webm', '.flv', '.wmv', '.m4v' ]
  gifs: [ '.gif' ]
